<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .flex-container {
            display: flex;
            background-color: lightgray;
            padding: 10px;
            flex-direction: row;  /*can make it row or column, can also add -reverse if needed*/
            justify-content: space-evenly; /*options are flex-start, flex-end, center, space-between, space-around, space-evenly*/
            height: 200px;
            align-items: baseline; /*options are flex-start, flex-end, center, stretch, baseline*/
            flex-wrap: wrap; /*options are nowrap, wrap, wrap-reverse*/
        }

        .item {
            background-color: steelblue;
            color: white;
            padding: 20px;
            margin: 5px;
        }
        /* used to align/move single item */
        /* .item:nth-child(2) {
            align-self: flex-end;
        } */ 
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item">Item 6</div>
        <div class="item">Item 7</div>
        <div class="item">Item 8</div>
        <div class="item">Item 9</div>
    </div>
</body>
</html>
