<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Class CSS Selectors</title>
        <!-- Class selector to style elements with a specific class -->
         <style>
            * {
                margin: 0;
                padding: 0;
            }

            .highlight {
                background-color: yellow;
                font-weight: bold;
            }
         </style>
    </head>
    <body>
        <p class="highlight">paragraph</p>
        <p class="highlight">paragraph</p>
        <p class="highlight">paragraph</p>
        <p class="highlight">paragraph</p>
        <p class="highlight">paragraph</p>
        <p class="highlight">paragraph</p>
        <p class="highlight">paragraph</p>
        <p class="highlight">paragraph</p>
        <p>not highlighted</p>
    </body>
</html>
