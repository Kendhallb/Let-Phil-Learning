<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layout and Positioning</title>
        <style>
            .block {
                background-color: lightblue;
                padding: 10px
            }

            .inline {
                background-color: lightgreen;
                padding: 5px
            }

            /* you can make lines act like one another */
            /* span{
            display: block;
            width: 200px} */

            /*can hide a line using "hidden class" */
            /* .hidden {
            display: none;} */
        </style>
    </head>
    <!--block takes full width, inline takes needed width  -->
    <!-- block = div, p, h1, section -->
    <!-- inline = span, a, strong -->
    <body>
        <div class="block">I am a block element</div>
        <span class="inline">I am inline</span>
        <span class="inline">I am inline too</span>
    </body>
</html>
