<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whop Fight!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <main class="game-screen">
    <div class="background"></div>
                <!-- Fight Animation-->
        <h1 class="fight">Get Ready!</h1>
    <!-- Health bars and Names and Vs -->
     <section class="game-ui">
        <div class="player1-ui">
            <h2 class="player-name">Gyutaro</h2>
            <div class="health-bar">
                <div class="health"></div>
            </div>
        </div>
        <div class="vs">Vs</div>
        <div class="player2-ui">
            <h2 class="player-name">Tanjiro</h2>
            <div class="health-bar">
                <div class="health"></div>
            </div>
        </div>
     </section>
     <!-- Characters (Player1, Player2)-->
     <section class="arena">
        <div class="player1">
            <img src="Gyutaro pixel.png">
        </div>
        <div class="player2">
            <img src="Tanjiro pixel.png">
        </div>
     </section>
     <!-- Floor and Button -->
      <footer class="floor">
        <button type="button">Start Battle</button>
      </footer>
      <script src="script.js"></script>
    </main>
</body>
</html>
