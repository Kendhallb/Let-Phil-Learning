<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Changing font family</title>
        <style>
            /* em - Relative to parent element 1em = 100% */
            /* rem - Relative to the root ( html {font-size: 16px} ) 1rem = 16px*/
            /* vw, vh - Relative to viewport width and height*/
            .serif {
                font-family: "Time New Roman", serif;
            }

            .sans-serif {
                font-family: Ariel, sans-serif;
            }

            .monospace {
                font-family: "Courier New", monospace;
            }

            .small {
                font-size: 12px;
            }

            .medium {
                font-size: 18px;
            }

            .large {
                font-size: 24px;
            }

            .relative-size {
                font-size: 1.5em;
            }

            .viewport-size {
                font-size: 5vw;
            }

            .light {
                font-weight: 300;
            }

            .normal {
                font-weight: 400;
            }

            .bold {
                font-weight: 700;
            }

            .italic {
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <p class="serif">this is serif font</p> 
        <p class="sans-serif">this is sans-serif font</p>
        <p class="monospace">this is monospace font</p>
        <!-- serif = long strokes, sans-serif = modern, monospace = typewriter -->
        <br />
        <br />
        <br />
        <p class="small">this is small text</p>
        <p class="medium">this is medium text</p>
        <p class="large">this is large text</p>
        <br />
        <br />
        <br />
        <p class="relative-size">this is relative size</p>
        <p class="viewport-size">viewport size</p>
        <br />
        <br />
        <br />
        <p class="light">light text</p>
        <p class="normal">normal text</p>
        <p class="bold italic">bold text</p>
    </body>
</html>
