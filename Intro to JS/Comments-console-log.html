<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments and Console</title>
</head>
<body>
    <script>
        // this is a comment

        /**
         * this is a multi line
         * comment
         * */

        // console.logging for debugging
        // console.log() - displays output in the browser console
        // console.warn() - show warning message
        // console.error() - displays an error message

        console.log("this is a message in the console");
        console.warn("this is a warning!");
        console.error("this is an error!");
    </script>
    
</body>
</html>
