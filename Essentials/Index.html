<!-- Declares document as HTML5 -->
<!DOCTYPE html>
<!-- This is the root element -->
<html>
    <!-- Head tag includes meta data such as title -->
    <head>
        <!-- Language in use -->
        <meta charset="UTF-8">
        <!-- Site description, tells browser the contents/purpose -->
        <meta name="description" content="learn HTML easily">
        <!-- Keywords for search engines -->
        <meta name="keywaords" content="HTML, CSS, JavaScript">
        <!-- Who wrote it -->
        <meta name="author" content="John Doe">
        <title>First Website</title>
    </head>
    <!-- Body tag holds all visible content -->
    <body>
        <!-- Text Tags -->
       <!-- Header tags h1 - h6 where h1 is the largest and h6 is the smallest -->
        <h1>Main Heading (h1)</h1>
        <h2>Sub Heading (h2)</h2>
        <h3>Section Title (h3)</h3>
        <h4>Smaller Title (h4)</h4>
        <h5>Even Smaller Title (h5)</h5>
        <h6>Smallest Title (h6)</h6>
        <!-- p tag for description -->
        <p>This is a paragraph tag (p)</p>
            <!-- Div tag for block level container, takes 100% width -->
            <div style="background-color: yellow ; padding: 10px;">
                <h3>Div Section </h3>
                <p>This is a block level container using "< div >"</p>
            </div>
            <!-- Span tag for inline container, takes up only the space needed -->
            <p>this text contains a <span style="color: red">highlighted word</span> using "< span >" tag</span></p>
        </body>
</html>
